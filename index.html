<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Survivor Arena - HTML5</title>
    <style>
        /* CSS resets and layout for full-screen mobile experience */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none; /* Prevent browser scrolling/zooming on mobile */
        }
        
        body {
            background-color: #1a1a24;
            overflow: hidden; /* Hide scrollbars */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        #gameCanvas {
            display: block;
            width: 100vw;
            height: 100vh;
        }

        /* UI Overlay Styling */
        #uiLayer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Let touches pass through to canvas/joystick */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
        }

        /* Top HUD: HP, EXP, Score */
        .top-hud {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
        }

        .stats {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .exp-bar-container {
            width: 50%;
            height: 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #555;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 10px;
            position: relative;
        }

        #expBar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            transition: width 0.2s;
        }
        
        #levelText {
            position: absolute;
            width: 100%;
            text-align: center;
            top: 0;
            font-size: 0.8rem;
            line-height: 16px;
            font-weight: bold;
        }

        /* Virtual Joystick Styling */
        #joystickZone {
            position: absolute;
            bottom: 30px;
            left: 30px;
            width: 150px;
            height: 150px;
            pointer-events: auto; /* Catch touch events here */
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: none; /* Shown via JS if touch is detected or forced */
        }

        #joystickKnob {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        /* Game Over Screen */
        #gameOverScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            display: none; /* Hidden initially */
            z-index: 100;
        }

        #gameOverScreen h1 {
            color: #ff4757;
            font-size: 3rem;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        #finalScore {
            font-size: 1.5rem;
            margin-bottom: 30px;
        }

        button {
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #ff6b81, #ff4757);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: transform 0.1s;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Level Up Screen */
        #levelUpScreen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            display: none; /* Hidden initially */
            z-index: 150;
            backdrop-filter: blur(3px);
        }

        #levelUpScreen h2 {
            color: #f1c40f;
            font-size: 2.5rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.6);
        }

        .skill-container {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 90%;
            max-width: 400px;
        }

        .skill-card {
            background: linear-gradient(135deg, #2c3e50, #1a252f);
            border: 2px solid #4facfe;
            border-radius: 12px;
            padding: 15px 20px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .skill-card:active {
            transform: scale(0.95);
        }

        .skill-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #fff;
            margin-bottom: 5px;
        }

        .skill-desc {
            font-size: 0.95rem;
            color: #bdc3c7;
        }
        
        .skill-level-text {
            font-size: 0.8rem;
            color: #f39c12;
            margin-top: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- The main canvas where the game is drawn -->
    <canvas id="gameCanvas"></canvas>

    <!-- UI Overlay for Stats and Controls -->
    <div id="uiLayer">
        <div class="top-hud">
            <div class="stats">
                <div style="color: #2ed573;">HP: <span id="hpText">100</span>/100</div>
                <div style="color: #eccc68; margin-top:5px;">Kills: <span id="scoreText">0</span></div>
            </div>
            
            <!-- Experience Bar -->
            <div class="exp-bar-container">
                <div id="expBar"></div>
                <div id="levelText">LVL 1</div>
            </div>
        </div>

        <!-- Touch Joystick for Android -->
        <div id="joystickZone">
            <div id="joystickKnob"></div>
        </div>
    </div>

    <!-- Game Over Screen -->
    <div id="gameOverScreen">
        <h1>You Died</h1>
        <div id="finalScore">Zombies Eliminated: 0</div>
        <div style="margin-bottom: 20px; font-size: 1rem; color: #aaa;">Level Reached: <span id="finalLevel">1</span></div>
        <button onclick="startGame()">Restart Game</button>
    </div>

    <!-- Level Up Screen -->
    <div id="levelUpScreen">
        <h2>Level Up!</h2>
        <div class="skill-container" id="skillContainer">
            <!-- Skill cards will be injected here via JS -->
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        // UI Elements
        const hpText = document.getElementById('hpText');
        const scoreText = document.getElementById('scoreText');
        const expBar = document.getElementById('expBar');
        const levelText = document.getElementById('levelText');
        const gameOverScreen = document.getElementById('gameOverScreen');
        const finalScore = document.getElementById('finalScore');
        const finalLevel = document.getElementById('finalLevel');
        
        const levelUpScreen = document.getElementById('levelUpScreen');
        const skillContainer = document.getElementById('skillContainer');
        
        // Joystick Elements
        const joystickZone = document.getElementById('joystickZone');
        const joystickKnob = document.getElementById('joystickKnob');

        // Game State Variables
        let animationId;
        let lastTime = 0;
        let isGameOver = false;
        
        // Game State Variables
        let animationId;
        let lastTime = 0;
        let isGameOver = false;
        let isPaused = false; // Added pause state for level up
        
        // Skill System Database
        const SKILL_DB = {
            rapid_fire: { 
                id: 'rapid_fire', name: "Rapid Fire", maxLvl: 5, 
                getDesc: (lvl) => `Tingkatkan kecepatan menembak. (Menjadi -15% delay)` 
            },
            heavy_bullets: { 
                id: 'heavy_bullets', name: "Heavy Bullets", maxLvl: 5, 
                getDesc: (lvl) => `Tingkatkan damage peluru (+10 Damage).` 
            },
            multi_shot: { 
                id: 'multi_shot', name: "Spread Shot", maxLvl: 4, 
                getDesc: (lvl) => `Tembakkan proyektil tambahan secara menyebar.` 
            },
            move_speed: { 
                id: 'move_speed', name: "Agility", maxLvl: 5, 
                getDesc: (lvl) => `Tingkatkan kecepatan gerak karakter.` 
            },
            vitality: { 
                id: 'vitality', name: "Vitality", maxLvl: 5, 
                getDesc: (lvl) => `Max HP +20 dan pulihkan HP sebesar 50.` 
            }
        };

        // Entities arrays
        let enemies = [];
        let bullets = [];
        let gems = [];
        let particles = [];

        // Camera/World offset (to make the world feel infinite)
        let camera = { x: 0, y: 0 };
        
        // Map Grid size (for background drawing)
        const gridSize = 100;

        // --- Resize Handling ---
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Player {
            constructor() {
                // Player stays in the center of the screen visually
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                
                // Actual world position
                this.worldX = 0;
                this.worldY = 0;
                
                this.radius = 20;
                this.speed = 250; // pixels per second
                
                // Stats
                this.maxHp = 100;
                this.hp = this.maxHp;
                this.level = 1;
                this.exp = 0;
                this.expToNext = 10;
                this.kills = 0;
                
                // Skill Levels tracker
                this.skills = {
                    rapid_fire: 0,
                    heavy_bullets: 0,
                    multi_shot: 0,
                    move_speed: 0,
                    vitality: 0
                };
                
                // Attack logic
                this.baseFireRate = 0.5;
                this.fireRate = 0.5; // seconds between shots
                this.fireTimer = 0;
                this.damage = 25;
                this.bulletSpeed = 600;
                
                // Input vector (from joystick or keyboard)
                this.vx = 0;
                this.vy = 0;
            }

            draw() {
                ctx.save();
                ctx.translate(this.x, this.y);
                
                // Add a glowing effect
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#4facfe';
                
                // Draw player body
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fill();
                ctx.lineWidth = 3;
                ctx.strokeStyle = '#4facfe';
                ctx.stroke();
                
                // Draw a simple core/eye
                ctx.beginPath();
                ctx.arc(0, 0, this.radius / 2, 0, Math.PI * 2);
                ctx.fillStyle = '#000000';
                ctx.fill();
                
                ctx.restore();
            }

            update(deltaTime) {
                // Move player in the world based on input
                if (this.vx !== 0 || this.vy !== 0) {
                    // Normalize diagonal movement
                    const length = Math.hypot(this.vx, this.vy);
                    const normX = this.vx / length;
                    const normY = this.vy / length;
                    
                    this.worldX += normX * this.speed * deltaTime;
                    this.worldY += normY * this.speed * deltaTime;
                }
                
                // Update Camera to follow player
                camera.x = this.worldX;
                camera.y = this.worldY;

                // Auto-Shooting logic
                this.fireTimer += deltaTime;
                if (this.fireTimer >= this.fireRate) {
                    this.shootClosestEnemy();
                }
            }

            shootClosestEnemy() {
                if (enemies.length === 0) return;

                let closestEnemy = null;
                let minDistance = Infinity;

                // Find closest zombie
                for (let enemy of enemies) {
                    // Calculate distance in world coordinates
                    const dx = enemy.worldX - this.worldX;
                    const dy = enemy.worldY - this.worldY;
                    const dist = Math.hypot(dx, dy);

                    // Only shoot if within screen range (+ margin)
                    if (dist < minDistance && dist < Math.max(canvas.width, canvas.height)) {
                        minDistance = dist;
                        closestEnemy = enemy;
                    }
                }

                if (closestEnemy) {
                    // Shoot!
                    this.fireTimer = 0;
                    
                    const dx = closestEnemy.worldX - this.worldX;
                    const dy = closestEnemy.worldY - this.worldY;
                    const baseAngle = Math.atan2(dy, dx);
                    
                    // Handle Multi-Shot spread
                    const shots = 1 + this.skills.multi_shot;
                    const spreadAngle = 0.25; // radians between bullets
                    const startAngle = baseAngle - (spreadAngle * (shots - 1)) / 2;
                    
                    for (let i = 0; i < shots; i++) {
                        const angle = startAngle + (spreadAngle * i);
                        bullets.push(new Bullet(this.worldX, this.worldY, angle, this.bulletSpeed, this.damage));
                    }
                    
                    // Add small recoil particle
                    createParticles(this.x, this.y, '#4facfe', 3, 10);
                }
            }

            takeDamage(amount) {
                this.hp -= amount;
                updateHUD();
                
                // Damage effect on screen
                ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                if (this.hp <= 0) {
                    endGame();
                }
            }

            gainExp(amount) {
                this.exp += amount;
                if (this.exp >= this.expToNext) {
                    this.levelUp();
                }
                updateHUD();
            }

            levelUp() {
                this.level++;
                this.exp -= this.expToNext;
                this.expToNext = Math.floor(this.expToNext * 1.3); // Increase required EXP moderately
                
                // Visual effect
                createParticles(this.x, this.y, '#eccc68', 30, 80);
                updateHUD();
                
                // Trigger Skill Selection
                triggerSkillSelection();
            }
        }

        class Enemy {
            constructor(spawnX, spawnY) {
                this.worldX = spawnX;
                this.worldY = spawnY;
                this.radius = 16;
                
                // Randomize zombie stats slightly
                this.speed = 100 + Math.random() * 50; 
                this.hp = 50 + (player.level * 10); // Scale with player level
                this.damage = 10;
                
                this.color = '#ff4757'; // Red zombie
            }

            draw() {
                // Calculate screen position relative to camera
                const screenX = canvas.width / 2 + (this.worldX - camera.x);
                const screenY = canvas.height / 2 + (this.worldY - camera.y);
                
                // Only draw if on screen (optimization)
                if (screenX < -50 || screenX > canvas.width + 50 || screenY < -50 || screenY > canvas.height + 50) {
                    return;
                }

                ctx.save();
                ctx.translate(screenX, screenY);
                
                // Zombie Body
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                
                // Zombie outline
                ctx.lineWidth = 2;
                ctx.strokeStyle = '#a4b0be';
                ctx.stroke();

                ctx.restore();
            }

            update(deltaTime) {
                // Move towards player (player is always at camera center in world coords)
                const dx = player.worldX - this.worldX;
                const dy = player.worldY - this.worldY;
                const dist = Math.hypot(dx, dy);
                
                if (dist > 0) {
                    const normX = dx / dist;
                    const normY = dy / dist;
                    
                    this.worldX += normX * this.speed * deltaTime;
                    this.worldY += normY * this.speed * deltaTime;
                }

                // Check collision with player
                if (dist < this.radius + player.radius) {
                    player.takeDamage(this.damage);
                    // Knockback zombie slightly to prevent continuous instant damage
                    this.worldX -= (dx / dist) * 50;
                    this.worldY -= (dy / dist) * 50;
                }
            }
        }

        class Bullet {
            constructor(worldX, worldY, angle, speed, damage) {
                this.worldX = worldX;
                this.worldY = worldY;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.damage = damage;
                this.radius = 6;
                this.lifeTime = 2.0; // Destroy after 2 seconds
                this.age = 0;
            }

            draw() {
                const screenX = canvas.width / 2 + (this.worldX - camera.x);
                const screenY = canvas.height / 2 + (this.worldY - camera.y);

                ctx.save();
                ctx.translate(screenX, screenY);
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#ffff00';
                
                ctx.beginPath();
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#ffff00'; // Yellow bullet
                ctx.fill();
                ctx.restore();
            }

            update(deltaTime) {
                this.worldX += this.vx * deltaTime;
                this.worldY += this.vy * deltaTime;
                this.age += deltaTime;
            }
        }

        class Gem {
            constructor(worldX, worldY, expValue) {
                this.worldX = worldX;
                this.worldY = worldY;
                this.expValue = expValue;
                this.radius = 8;
                // Wobble effect
                this.seed = Math.random() * Math.PI * 2;
                this.magnetRadius = 150; // Distance to auto-collect
            }

            draw() {
                const screenX = canvas.width / 2 + (this.worldX - camera.x);
                const screenY = canvas.height / 2 + (this.worldY - camera.y);

                // Add simple floating animation
                const hoverOffset = Math.sin(Date.now() / 200 + this.seed) * 3;

                ctx.save();
                ctx.translate(screenX, screenY + hoverOffset);
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00f2fe';

                // Draw diamond shape
                ctx.beginPath();
                ctx.moveTo(0, -this.radius);
                ctx.lineTo(this.radius, 0);
                ctx.lineTo(0, this.radius);
                ctx.lineTo(-this.radius, 0);
                ctx.closePath();
                ctx.fillStyle = '#00f2fe';
                ctx.fill();
                ctx.lineWidth = 1;
                ctx.strokeStyle = '#ffffff';
                ctx.stroke();
                
                ctx.restore();
            }

            update(deltaTime) {
                // Magnet mechanic: pull gem towards player if close
                const dx = player.worldX - this.worldX;
                const dy = player.worldY - this.worldY;
                const dist = Math.hypot(dx, dy);

                if (dist < this.magnetRadius) {
                    const pullSpeed = 400 * deltaTime; // Move fast towards player
                    this.worldX += (dx / dist) * pullSpeed;
                    this.worldY += (dy / dist) * pullSpeed;
                }
            }
        }

        class Particle {
            constructor(screenX, screenY, color, speed) {
                this.x = screenX;
                this.y = screenY;
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * speed;
                this.vx = Math.cos(angle) * velocity;
                this.vy = Math.sin(angle) * velocity;
                this.color = color;
                this.alpha = 1;
                this.radius = Math.random() * 3 + 1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }

            update(deltaTime) {
                this.x += this.vx * deltaTime;
                this.y += this.vy * deltaTime;
                this.alpha -= deltaTime * 2; // Fade out quickly
            }
        }

        function createParticles(x, y, color, count, speed) {
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, speed));
            }
        }

        let player;
        
        // --- Keyboard Controls (for Desktop testing) ---
        const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };
        
        window.addEventListener('keydown', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
            updateKeyboardInput();
        });
        
        window.addEventListener('keyup', (e) => {
            if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
            updateKeyboardInput();
        });

        function updateKeyboardInput() {
            let vx = 0;
            let vy = 0;
            if (keys.w || keys.ArrowUp) vy = -1;
            if (keys.s || keys.ArrowDown) vy = 1;
            if (keys.a || keys.ArrowLeft) vx = -1;
            if (keys.d || keys.ArrowRight) vx = 1;
            
            // Only use keyboard if joystick isn't active
            if (!isJoystickActive) {
                player.vx = vx;
                player.vy = vy;
            }
        }

        // --- Virtual Joystick Controls (Android Touch) ---
        let isJoystickActive = false;
        let joystickCenter = { x: 0, y: 0 };
        const maxJoystickDist = 45; // Max radius knob can move

        // Enable joystick UI if touch is detected
        window.addEventListener('touchstart', () => {
            joystickZone.style.display = 'block';
        }, { once: true });

        joystickZone.addEventListener('touchstart', handleJoystickStart, {passive: false});
        joystickZone.addEventListener('touchmove', handleJoystickMove, {passive: false});
        joystickZone.addEventListener('touchend', handleJoystickEnd);
        joystickZone.addEventListener('touchcancel', handleJoystickEnd);

        function handleJoystickStart(e) {
            e.preventDefault();
            isJoystickActive = true;
            const touch = e.changedTouches[0];
            const rect = joystickZone.getBoundingClientRect();
            joystickCenter.x = rect.left + rect.width / 2;
            joystickCenter.y = rect.top + rect.height / 2;
            updateJoystick(touch.clientX, touch.clientY);
        }

        function handleJoystickMove(e) {
            e.preventDefault();
            if (!isJoystickActive) return;
            const touch = e.changedTouches[0];
            updateJoystick(touch.clientX, touch.clientY);
        }

        function handleJoystickEnd(e) {
            e.preventDefault();
            isJoystickActive = false;
            // Reset knob visual
            joystickKnob.style.transform = `translate(-50%, -50%)`;
            // Stop player
            player.vx = 0;
            player.vy = 0;
        }

        function updateJoystick(touchX, touchY) {
            const dx = touchX - joystickCenter.x;
            const dy = touchY - joystickCenter.y;
            const dist = Math.hypot(dx, dy);
            
            // Constrain knob visually
            let knobX = dx;
            let knobY = dy;
            
            if (dist > maxJoystickDist) {
                knobX = (dx / dist) * maxJoystickDist;
                knobY = (dy / dist) * maxJoystickDist;
            }
            
            joystickKnob.style.transform = `translate(calc(-50% + ${knobX}px), calc(-50% + ${knobY}px))`;

            // Normalize input for player (-1 to 1)
            const inputDist = Math.min(dist, maxJoystickDist);
            const normX = (dx / dist) || 0;
            const normY = (dy / dist) || 0;
            
            // Speed scales with how far joystick is pushed
            const magnitude = inputDist / maxJoystickDist;
            
            player.vx = normX * magnitude;
            player.vy = normY * magnitude;
        }


        let enemySpawnTimer = 0;
        let enemySpawnRate = 1.0; // Seconds between spawns (gets faster)

        function spawnEnemy() {
            // Spawn outside the visible screen
            const angle = Math.random() * Math.PI * 2;
            const spawnDist = Math.max(canvas.width, canvas.height) / 2 + 100;
            
            const spawnX = player.worldX + Math.cos(angle) * spawnDist;
            const spawnY = player.worldY + Math.sin(angle) * spawnDist;
            
            enemies.push(new Enemy(spawnX, spawnY));
        }

        function drawBackground() {
            // Draw an infinite grid pattern relative to camera
            ctx.strokeStyle = '#2f3542';
            ctx.lineWidth = 2;

            const startX = - (camera.x % gridSize);
            const startY = - (camera.y % gridSize);

            ctx.beginPath();
            // Vertical lines
            for (let x = startX; x < canvas.width; x += gridSize) {
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
            }
            // Horizontal lines
            for (let y = startY; y < canvas.height; y += gridSize) {
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
            }
            ctx.stroke();
        }

        function updateHUD() {
            hpText.innerText = Math.max(0, Math.floor(player.hp));
            scoreText.innerText = player.kills;
            
            const expPercent = Math.min(100, (player.exp / player.expToNext) * 100);
            expBar.style.width = `${expPercent}%`;
            levelText.innerText = `LVL ${player.level}`;
        }

        function triggerSkillSelection() {
            isPaused = true;
            
            // Generate pool of available skills (not maxed out)
            let availableSkills = Object.values(SKILL_DB).filter(skill => player.skills[skill.id] < skill.maxLvl);
            
            skillContainer.innerHTML = ''; // Clear previous options
            
            if (availableSkills.length === 0) {
                // If everything is maxed out, give a default heal option
                createSkillCard({
                    id: 'default_heal',
                    name: "Field Ration",
                    desc: "Sembuhkan 30 HP.",
                    lvlText: "MAX LEVEL REACHED"
                }, () => {
                    player.hp = Math.min(player.maxHp, player.hp + 30);
                    resumeGame();
                });
                levelUpScreen.style.display = 'flex';
                return;
            }

            // Shuffle and pick up to 3 random skills
            availableSkills.sort(() => 0.5 - Math.random());
            const choices = availableSkills.slice(0, 3);

            choices.forEach(skill => {
                const currentLvl = player.skills[skill.id];
                createSkillCard({
                    id: skill.id,
                    name: skill.name,
                    desc: skill.getDesc(currentLvl),
                    lvlText: `Upgrade ke Level ${currentLvl + 1} / ${skill.maxLvl}`
                }, () => applySkill(skill.id));
            });

            levelUpScreen.style.display = 'flex';
        }

        function createSkillCard(data, onClickCallback) {
            const card = document.createElement('div');
            card.className = 'skill-card';
            card.innerHTML = `
                <div class="skill-name">${data.name}</div>
                <div class="skill-desc">${data.desc}</div>
                <div class="skill-level-text">${data.lvlText}</div>
            `;
            
            // Handle both touch and click for better mobile response
            card.addEventListener('mousedown', onClickCallback);
            card.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Prevent double firing from touch & click
                onClickCallback();
            }, { passive: false });
            
            skillContainer.appendChild(card);
        }

        function applySkill(skillId) {
            player.skills[skillId]++;
            
            // Apply Skill Effects
            switch (skillId) {
                case 'rapid_fire':
                    player.fireRate = player.baseFireRate * Math.pow(0.85, player.skills.rapid_fire);
                    break;
                case 'heavy_bullets':
                    player.damage += 10;
                    break;
                case 'multi_shot':
                    // Handled automatically in shootClosestEnemy()
                    break;
                case 'move_speed':
                    player.speed += 25;
                    break;
                case 'vitality':
                    player.maxHp += 20;
                    player.hp = Math.min(player.maxHp, player.hp + 50);
                    break;
            }
            
            updateHUD();
            resumeGame();
        }

        function resumeGame() {
            levelUpScreen.style.display = 'none';
            // Reset lastTime so delta time doesn't jump hugely after pause
            lastTime = performance.now();
            isPaused = false;
        }

        function startGame() {
            player = new Player();
            enemies = [];
            bullets = [];
            gems = [];
            particles = [];
            
            camera = { x: 0, y: 0 };
            lastTime = performance.now();
            isGameOver = false;
            isPaused = false;
            enemySpawnRate = 1.0;
            
            gameOverScreen.style.display = 'none';
            levelUpScreen.style.display = 'none';
            updateHUD();
            
            if (animationId) cancelAnimationFrame(animationId);
            gameLoop(lastTime);
        }

        function endGame() {
            isGameOver = true;
            finalScore.innerText = `Zombies Eliminated: ${player.kills}`;
            finalLevel.innerText = player.level;
            gameOverScreen.style.display = 'flex';
        }

        function gameLoop(timestamp) {
            if (isGameOver) return;

            // Pause Logic
            if (isPaused) {
                animationId = requestAnimationFrame(gameLoop);
                return;
            }

            // Calculate Delta Time (in seconds) to ensure smooth movement regardless of FPS
            const deltaTime = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            // Prevent huge jumps if tab was inactive
            if (deltaTime > 0.1) {
                animationId = requestAnimationFrame(gameLoop);
                return;
            }

            // 1. Clear Screen & Draw Background
            ctx.fillStyle = '#1a1a24';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawBackground();

            // 2. Update & Draw Gems
            for (let i = gems.length - 1; i >= 0; i--) {
                let gem = gems[i];
                gem.update(deltaTime);
                gem.draw();

                // Check collect collision (distance to player)
                const dist = Math.hypot(gem.worldX - player.worldX, gem.worldY - player.worldY);
                if (dist < player.radius + gem.radius) {
                    player.gainExp(gem.expValue);
                    
                    // Collect effect
                    const screenX = canvas.width / 2 + (gem.worldX - camera.x);
                    const screenY = canvas.height / 2 + (gem.worldY - camera.y);
                    createParticles(screenX, screenY, '#00f2fe', 5, 20);
                    
                    gems.splice(i, 1);
                }
            }

            // 3. Update & Draw Player
            player.update(deltaTime);
            player.draw();

            // 4. Update & Draw Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                let bullet = bullets[i];
                bullet.update(deltaTime);
                bullet.draw();

                if (bullet.age >= bullet.lifeTime) {
                    bullets.splice(i, 1);
                    continue;
                }

                // Check collision with enemies
                let hit = false;
                for (let j = enemies.length - 1; j >= 0; j--) {
                    let enemy = enemies[j];
                    const dist = Math.hypot(bullet.worldX - enemy.worldX, bullet.worldY - enemy.worldY);
                    
                    if (dist < bullet.radius + enemy.radius) {
                        enemy.hp -= bullet.damage;
                        
                        // Impact effect
                        const screenX = canvas.width / 2 + (enemy.worldX - camera.x);
                        const screenY = canvas.height / 2 + (enemy.worldY - camera.y);
                        createParticles(screenX, screenY, '#ffff00', 8, 40);

                        if (enemy.hp <= 0) {
                            player.kills++;
                            updateHUD();
                            // Death effect (Blood)
                            createParticles(screenX, screenY, '#ff4757', 15, 60);
                            
                            // Drop EXP Gem
                            gems.push(new Gem(enemy.worldX, enemy.worldY, 2));
                            
                            enemies.splice(j, 1);
                        }
                        hit = true;
                        break; // Bullet destroys on first hit
                    }
                }
                if (hit) {
                    bullets.splice(i, 1);
                }
            }

            // 5. Update & Draw Enemies, and Spawner Logic
            enemySpawnTimer += deltaTime;
            if (enemySpawnTimer >= enemySpawnRate) {
                spawnEnemy();
                enemySpawnTimer = 0;
                // Slowly increase difficulty
                enemySpawnRate = Math.max(0.1, enemySpawnRate - 0.01); 
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].update(deltaTime);
                enemies[i].draw();
            }

            // 6. Update & Draw Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update(deltaTime);
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            // Request next frame
            animationId = requestAnimationFrame(gameLoop);
        }

        // Initialize the game
        window.onload = () => {
            startGame();
        };

    </script>
</body>
</html>
